<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="786px" preserveAspectRatio="none" style="width:689px;height:786px;background:#FFFFFF;" version="1.1" viewBox="0 0 689 786" width="689px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="349" x="168.75" y="34.5332">Does this field change when the program moves?</text><ellipse cx="344.25" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="180" x="254.25" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160" x="264.25" y="111.0664">A field the assembler emitted</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="160" x="264.25" y="196.293"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140" x="274.25" y="218.75">Absolute. Never changes.</text><ellipse cx="344.25" cy="269.4219" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="344.25" cy="269.4219" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="272.25,143.7031,416.25,143.7031,428.25,157.5391,416.25,171.375,272.25,171.375,260.25,157.5391,272.25,143.7031" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="174" x="348.25" y="182.7939">no: opcode, #constant, EQU number</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="144" x="272.25" y="155.1221">Does it hold a value computed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="133" x="272.25" y="168.958">from labels of the program?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="18" x="428.25" y="155.1221">yes</text><polygon fill="#F1F1F1" points="267.25,322.4219,421.25,322.4219,433.25,343.1758,421.25,363.9297,267.25,363.9297,255.25,343.1758,267.25,322.4219" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="154" x="267.25" y="333.8408">Net relocation of the expression</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="131" x="267.25" y="347.6768">+1 per relative name added</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="153" x="267.25" y="361.5127">&#8722;1 per relative name subtracted</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216" x="130.25" y="398.3896"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196" x="140.25" y="420.8467">A distance, e.g. WORD PTR-VALUE.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86" x="140.25" y="435.9404">Never changes.</text><ellipse cx="238.25" cy="479.5771" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="238.25" cy="479.5771" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="166" x="366.25" y="398.3896"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141" x="376.25" y="420.8467">Error: cannot be relocated</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146" x="376.25" y="435.9404">(e.g. VALUE+PTR is net 2).</text><ellipse cx="449.25" cy="479.5771" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="449.25" cy="479.5771" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="344.25,500.5771,344.25,500.5771,356.25,512.5771,344.25,524.5771,344.25,524.5771,332.25,512.5771,344.25,500.5771" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="299.75,544.5771,388.75,544.5771,400.75,556.5771,388.75,568.5771,299.75,568.5771,287.75,556.5771,299.75,544.5771" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="89" x="299.75" y="561.0781">What kind of field?</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="207" x="11" y="638.9199"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187" x="21" y="661.377">Relative. The assembler writes an</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159" x="21" y="676.4707">M record; the loader adds the</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76" x="21" y="691.5645">load address.</text><ellipse cx="114.5" cy="750.2012" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="114.5" cy="750.2012" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187" x="238" y="652.7559"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167" x="248" y="675.2129">A distance inside the program.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86" x="248" y="690.3066">Never changes.</text><ellipse cx="331.5" cy="748.9434" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="331.5" cy="748.9434" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="215" x="445" y="652.7559"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161" x="455" y="675.2129">Fixed field. Right only where it</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195" x="455" y="690.3066">was assembled; the loader refuses</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="55" x="455" y="705.4004">to move it.</text><ellipse cx="552.5" cy="764.0371" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="552.5" cy="764.0371" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="344.25" x2="344.25" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="340.25,78.6094,344.25,88.6094,348.25,78.6094,344.25,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="344.25" x2="344.25" y1="231.3867" y2="258.4219"/><polygon fill="#181818" points="340.25,248.4219,344.25,258.4219,348.25,248.4219,344.25,252.4219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="344.25" x2="344.25" y1="171.375" y2="196.293"/><polygon fill="#181818" points="340.25,186.293,344.25,196.293,348.25,186.293,344.25,190.293" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="428.25" x2="440.25" y1="157.5391" y2="157.5391"/><polygon fill="#181818" points="436.25,228.4219,440.25,238.4219,444.25,228.4219,440.25,232.4219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0